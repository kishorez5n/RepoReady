name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node dist/src/cli.js scan . --min-score 85 --format json --output .repo-ready/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-readiness-report
          path: .repo-ready/report.json
